<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in dialog</title>
<link rel="stylesheet" href="../../components/index.css">
<link rel="stylesheet" href="../_specimen.css">
</head>
<body>
<div class="device"><div class="app-case">
<div class="kit-dlgs"><dialog open id="signinDialog" class="app-dialog signin-dialog" aria-label="Sign in or create account">
    <div class="sheet-head">
      <h2>Sign in or create account</h2>
      <p class="sheet-sub">You are about to place a bet. No crypto wallet required.</p>
      <button type="button" class="sheet-close" data-close-dialog aria-label="Close">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <button type="button" class="provider-btn" data-flow="signin-to-deposit">
        <svg class="ic prov-google" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.6-.21-2.36H12v4.47h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.58-5.17 3.58-8.74z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.91l-3.88-3.01c-1.07.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.27a7.2 7.2 0 0 1 0-4.54V6.62H1.26a12 12 0 0 0 0 10.76l4.01-3.11z"/><path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.26 6.62l4.01 3.11C6.22 6.88 8.87 4.77 12 4.77z"/></svg>
        Continue with Google
      </button>
      <button type="button" class="provider-btn" data-flow="signin-to-deposit">
        <svg class="ic prov-x" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 1.15h3.68l-8.05 9.2L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.46l8.6-9.84L0 1.15h7.6l5.24 6.93 6.06-6.93zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41z"/></svg>
        Continue with X
      </button>
      <button type="button" class="provider-btn" data-flow="signin-to-deposit">
        <svg class="ic prov-apple" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c-.03-2.7 2.2-3.99 2.3-4.06-1.26-1.84-3.21-2.09-3.9-2.12-1.66-.17-3.24.98-4.09.98-.84 0-2.13-.96-3.51-.93-1.81.03-3.48 1.05-4.41 2.67-1.88 3.27-.48 8.1 1.35 10.76.9 1.3 1.96 2.76 3.37 2.71 1.35-.05 1.86-.87 3.5-.87 1.63 0 2.09.87 3.52.85 1.45-.03 2.37-1.33 3.26-2.63 1.03-1.51 1.45-2.97 1.47-3.05-.03-.01-2.82-1.08-2.85-4.29zM14.4 4.6c.74-.9 1.24-2.16 1.11-3.41-1.07.04-2.38.72-3.15 1.62-.68.8-1.28 2.07-1.12 3.29 1.19.09 2.41-.61 3.16-1.5z"/></svg>
        Continue with Apple
      </button>
      <p class="fine">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </dialog></div>
</div></div>
<script>
/* Report to the vitrine: how tall this specimen is, and whether it rendered.
   postMessage crosses origins, so this works from file:// as well as from a
   server, where reading the frame document from the parent would not. */
(function () {
  var errors = [];
  window.addEventListener("error", function (e) { errors.push(String(e.message)); });

  function shown(el) {
    if (el.checkVisibility) return el.checkVisibility({opacityProperty: true, visibilityProperty: true});
    var s = getComputedStyle(el);
    return s.display !== "none" && s.visibility !== "hidden" && s.opacity !== "0";
  }

  function height() {
    /* An open dialog and the mobile bet sheet are out of flow, so scrollHeight
       alone reports next to nothing for them. Sweep the boxes as well, but only
       the ones a person can see: a closed dropdown still has a box. */
    var h = document.body.scrollHeight, y = window.scrollY || 0, all = document.body.getElementsByTagName("*");
    for (var i = 0; i < all.length; i++) {
      var r = all[i].getBoundingClientRect();
      if (r.height && r.bottom + y > h && shown(all[i])) h = Math.ceil(r.bottom + y);
    }
    return h;
  }

  /* A link with no rule behind it falls back to the browser blue, which is the
     one colour the Vault has no place for. Counted, so it can never come back
     unnoticed. Only links that render text of their own count: the product wraps
     a button in a bare <a> in several places, and that anchor paints nothing. */
  var UA_LINK = {"rgb(0, 0, 238)": 1, "rgb(85, 26, 139)": 1, "rgb(0, 0, 255)": 1};

  function paintsText(el) {
    for (var i = 0; i < el.childNodes.length; i++) {
      var n = el.childNodes[i];
      if (n.nodeType === 3 && n.textContent.trim()) return true;
    }
    return false;
  }

  function send() {
    var doc = document.documentElement;
    var dead = 0, uses = document.querySelectorAll("use");
    for (var i = 0; i < uses.length; i++) {
      var ref = uses[i].getAttribute("href") || "";
      if (ref.charAt(0) === "#" && !document.getElementById(ref.slice(1))) dead++;
    }
    var ua = 0, links = document.querySelectorAll("a");
    for (var j = 0; j < links.length; j++) {
      if (UA_LINK[getComputedStyle(links[j]).color] && paintsText(links[j])) ua++;
    }
    try {
      parent.postMessage({
        specimen: "signin",
        height: height(),
        elements: document.body.getElementsByTagName("*").length,
        overflowX: doc.scrollWidth - doc.clientWidth,
        deadIcons: dead,
        uaLinks: ua,
        errors: errors
      }, "*");
    } catch (e) {}
  }

  /* The vitrine may finish loading after this frame does, so it also asks. */
  window.addEventListener("message", function (e) { if (e.data && e.data.ping) send(); });
  window.addEventListener("load", send);
  window.addEventListener("resize", send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);
  if (document.fonts) document.fonts.ready.then(send);
  setTimeout(send, 80);
})();
</script>
</body>
</html>
