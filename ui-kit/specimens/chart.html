<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price chart</title>
<script id="uvTheme">/* theme boot: applied before the first paint, so daylight never flashes graphite.
   A frame is a document of its own, so it does not inherit the attribute: this
   block runs in the frames too and they are told by postMessage, the same
   handshake _frames.js already uses, because from file:// every document has
   its own opaque origin and reading into a frame is refused.
   Built by ui-visual/_theme_switch.py. Remove with --strip. */
(function(){var K='pm-theme',r=document.documentElement;
try{if(localStorage.getItem(K)==='light')r.setAttribute('data-theme','light')}catch(e){}
function lit(){return r.getAttribute('data-theme')==='light'}
function set(on){if(on){r.setAttribute('data-theme','light')}else{r.removeAttribute('data-theme')}}
function push(){var f=document.getElementsByTagName('iframe');
for(var i=0;i<f.length;i++){try{f[i].contentWindow.postMessage({pmTheme:lit()?'light':'dark'},'*')}catch(e){}}}
function paint(){var all=document.querySelectorAll('.theme-switch');
for(var i=0;i<all.length;i++){all[i].setAttribute('aria-pressed',lit()?'true':'false');
var l=all[i].querySelector('.ts-label');if(l)l.textContent=lit()?'Daylight':'Vault';}
push();}
function wire(){var all=document.querySelectorAll('.theme-switch');
for(var i=0;i<all.length;i++){if(all[i].dataset.wired)continue;all[i].dataset.wired='1';
all[i].addEventListener('click',function(){var on=lit();set(!on);
try{localStorage.setItem(K,on?'dark':'light')}catch(e){}paint();});}
paint();}
window.addEventListener('message',function(e){var d=e.data;
if(!d||(d.pmTheme!=='light'&&d.pmTheme!=='dark'))return;
set(d.pmTheme==='light');paint();});
document.addEventListener('DOMContentLoaded',function(){wire();
/* the kit side panel is rendered by _nav.js after this fires, so wire once more */
setTimeout(wire,0);
/* a frame that arrives late is told as soon as it is ready */
var f=document.getElementsByTagName('iframe');
for(var i=0;i<f.length;i++){f[i].addEventListener('load',push);}
push();});})();</script>
<link rel="stylesheet" href="../../components/index.css">
<link rel="stylesheet" href="../_specimen.css">
</head>
<body>
<div class="device"><div class="app-case">
<main class="feed"><div class="feed-inner"><div class="ed-main"><div class="card"><div class="card-body">
      <section class="ed-section ed-chart">
        <div class="ed-chart-head"><h3>Price chart</h3><span class="ed-chart-now">YES 38% now</span></div>
        <div class="ed-chart-area">
          <div class="ed-yaxis"><span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span></div>
          <div class="ed-plot"><svg class="chart-svg" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"><line class="grid-l" x1="0" y1="25" x2="300" y2="25"/><line class="grid-l" x1="0" y1="50" x2="300" y2="50"/><line class="grid-l" x1="0" y1="75" x2="300" y2="75"/><polyline points="0,52 30,48 60,55 90,60 120,57 150,63 180,61 210,67 240,59 270,63 300,62"/><line class="nowline" x1="300" y1="0" x2="300" y2="100"/></svg></div>
        </div>
        <div class="ed-xaxis" aria-hidden="true"></div>
        <div class="ed-chart-foot"><div class="ed-range" role="group" aria-label="Time range"><button type="button">1d</button><button type="button">1w</button><button type="button">1m</button><button type="button" class="sel">all</button></div></div>
      </section>
    </div></div></div></div></main>
</div></div>
<script>
/* Report to the vitrine: how tall this specimen is, and whether it rendered.
   postMessage crosses origins, so this works from file:// as well as from a
   server, where reading the frame document from the parent would not. */
(function () {
  var errors = [];
  window.addEventListener("error", function (e) { errors.push(String(e.message)); });

  function shown(el) {
    if (el.checkVisibility) return el.checkVisibility({opacityProperty: true, visibilityProperty: true});
    var s = getComputedStyle(el);
    return s.display !== "none" && s.visibility !== "hidden" && s.opacity !== "0";
  }

  function height() {
    /* An open dialog and the mobile bet sheet are out of flow, so scrollHeight
       alone reports next to nothing for them. Sweep the boxes as well, but only
       the ones a person can see: a closed dropdown still has a box. */
    var h = document.body.scrollHeight, y = window.scrollY || 0, all = document.body.getElementsByTagName("*");
    for (var i = 0; i < all.length; i++) {
      var r = all[i].getBoundingClientRect();
      if (r.height && r.bottom + y > h && shown(all[i])) h = Math.ceil(r.bottom + y);
    }
    return h;
  }

  /* A link with no rule behind it falls back to the browser blue, which is the
     one colour the Vault has no place for. Counted, so it can never come back
     unnoticed. Only links that render text of their own count: the product wraps
     a button in a bare <a> in several places, and that anchor paints nothing. */
  var UA_LINK = {"rgb(0, 0, 238)": 1, "rgb(85, 26, 139)": 1, "rgb(0, 0, 255)": 1};

  function paintsText(el) {
    for (var i = 0; i < el.childNodes.length; i++) {
      var n = el.childNodes[i];
      if (n.nodeType === 3 && n.textContent.trim()) return true;
    }
    return false;
  }

  function send() {
    var doc = document.documentElement;
    var dead = 0, uses = document.querySelectorAll("use");
    for (var i = 0; i < uses.length; i++) {
      var ref = uses[i].getAttribute("href") || "";
      if (ref.charAt(0) === "#" && !document.getElementById(ref.slice(1))) dead++;
    }
    var ua = 0, links = document.querySelectorAll("a");
    for (var j = 0; j < links.length; j++) {
      if (UA_LINK[getComputedStyle(links[j]).color] && paintsText(links[j])) ua++;
    }
    try {
      parent.postMessage({
        specimen: "chart",
        height: height(),
        elements: document.body.getElementsByTagName("*").length,
        overflowX: doc.scrollWidth - doc.clientWidth,
        deadIcons: dead,
        uaLinks: ua,
        errors: errors
      }, "*");
    } catch (e) {}
  }

  /* The vitrine may finish loading after this frame does, so it also asks. */
  window.addEventListener("message", function (e) { if (e.data && e.data.ping) send(); });
  window.addEventListener("load", send);
  window.addEventListener("resize", send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);
  if (document.fonts) document.fonts.ready.then(send);
  setTimeout(send, 80);
})();
</script>
</body>
</html>
