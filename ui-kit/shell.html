<div class="device app-case">
  <header class="app-header">
      <div class="row">
        <div class="left">

        </div>

        <div class="utility">
          <!-- Balance: one figure + swap icon (Portfolio <-> Cash). Desktop only. -->
          <div class="bal-toggle desk-only">
            <span class="bal-figure"><span class="bal-label" id="balLabel">Portfolio</span> <span class="bal-amt" id="balAmt">$142.00</span></span>
            <button type="button" class="icon-btn bal-swap" id="balSwap" aria-label="Swap balance (showing Portfolio)">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
            </button>
            <button type="button" class="icon-btn bal-add" data-open="deposit" aria-label="Add funds">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>

          <!-- Favorites: desktop header only (on mobile it is the bottom-bar slot). -->
          <a href="#" aria-label="Favorites, see saved events"><button type="button" class="icon-btn desk-only" aria-label="Favorites">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bookmark-b"/></svg>
          </button></a>

          <!-- Notifications bell: header on both breakpoints (badge = retention anchor). -->
          <details class="notif-menu">
            <summary aria-label="Notifications, 3 unread">
              <span class="bell-wrap">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bell-b"/></svg>

            <div class="dropdown notif-drop" role="menu">

              <a class="notif-all" href="#">See all notifications</a>
            </div>
