              - generic [ref=e1265]:
                - generic [ref=e1266]:
                  - heading "What is Polymarket?" [level=3] [ref=e1267]:
                    - button "What is Polymarket?" [ref=e1268] [cursor=pointer]:
                      - generic [ref=e1269]: What is Polymarket?
                      - img [ref=e1270]
                  - region "What is Polymarket?":
                    - generic [ref=e1272]: Polymarket is the world's largest prediction market, where users trade on the real-world outcomes of events across Politics and many other topics. Prices are quoted from 0 to 100 cents and reflect the implied probability that an event will occur. Because traders put real money behind their views, Polymarket odds represent a real-time, skin-in-the-game consensus, often referred to as the "wisdom of the crowd."
                - generic [ref=e1273]:
                  - heading "What is a Politics prediction market?" [level=3] [ref=e1274]:
                    - button "What is a Politics prediction market?" [ref=e1275] [cursor=pointer]:
                      - generic [ref=e1276]: What is a Politics prediction market?
                      - img [ref=e1277]
                  - region "What is a Politics prediction market?":
                    - generic [ref=e1279]: "A Politics prediction market lets users trade Yes or No shares on a specific question tied to Politics-related events, such as \"Balance of Power: 2026 Midterms\". Each share pays out $1 if the outcome resolves in its favor, and $0 if it does not. The current share price, for example, 45% on \"Democrats Sweep\", reflects the market's implied probability for that outcome at any given moment."
                - generic [ref=e1280]:
                  - heading "What topics can I trade on in the Politics category?" [level=3] [ref=e1281]:
                    - button "What topics can I trade on in the Politics category?" [ref=e1282] [cursor=pointer]:
                      - generic [ref=e1283]: What topics can I trade on in the Politics category?
                      - img [ref=e1284]
                  - region "What topics can I trade on in the Politics category?":
                    - generic [ref=e1286]: The Politics category hosts 1.6K markets covering a wide range of subjects. Popular subcategories include Midterms, Trump, and Primaries, each with its own dedicated page showing live odds, trading volume, and active markets. You can browse the full list of Politics subcategories from the left-side navigation on the Politics page.
                - generic [ref=e1287]:
                  - heading "How do Politics odds on Polymarket work?" [level=3] [ref=e1288]:
                    - button "How do Politics odds on Polymarket work?" [ref=e1289] [cursor=pointer]:
                      - generic [ref=e1290]: How do Politics odds on Polymarket work?
                      - img [ref=e1291]
                  - region "How do Politics odds on Polymarket work?":
                    - generic [ref=e1293]: "Every Politics market on Polymarket has outcomes priced between 0¢ and 100¢. That price is the implied probability of the outcome occurring. For example, if \"Democrats Sweep\" is trading at 45% in \"Balance of Power: 2026 Midterms\", traders are collectively pricing in roughly that probability. Prices update continuously as new information, data releases, and events move trader sentiment."
                - generic [ref=e1294]:
                  - heading "Which Politics markets are most active right now?" [level=3] [ref=e1295]:
                    - button "Which Politics markets are most active right now?" [ref=e1296] [cursor=pointer]:
                      - generic [ref=e1297]: Which Politics markets are most active right now?
                      - img [ref=e1298]
                  - region "Which Politics markets are most active right now?":
                    - generic [ref=e1300]: "Activity is constantly shifting, but you can sort the page by 24-hour volume to see where trading is concentrated. Currently, \"Fed Decision in June?\" is among the most actively traded markets on the Politics page, alongside other high-volume markets like \"Balance of Power: 2026 Midterms\" and \"Fed Decision in June?\"."
