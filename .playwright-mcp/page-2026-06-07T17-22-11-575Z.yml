            - generic [ref=e275]:
              - generic [ref=e276]: This market will resolve according to the result of the 2026 United States midterm elections. A party will be considered to have 'control' of the House of Representatives, if they win a majority of voting seats. A party will be considered to have 'control' of the Senate if they have more than half of the voting Senate members, or half of the voting Senate members and the Vice President. A candidate's party is determined by their ballot-listed or otherwise identifiable affiliation with that party at the time the 2026 United States midterm elections are conclusively called by this market's resolution sources. A candidate without a ballot-listed affiliation to either the Democrat or Republican Parties will be considered a member of one of these parties based on the party that they most recently expressed their intent to caucus with at the time the 2026 United States midterm elections are conclusively called by this market's resolution sources. If control of the House is ambiguous given the above rules, this market will resolve according to the party affiliation of the first Speaker of the US House who is selected following the 2026 United States midterm elections. If control of the Senate is ambiguous given the above rules, this market will resolve according to the party affiliation of the first Majority Leader of the US Senate who is selected following the 2026 United States midterm elections. The resolution source for this market is the Associated Press, Fox News, and NBC. This market will resolve once all three sources have conclusively called winners of the House and Senate in the 2026 United States midterm elections. If all three sources do not achieve consensus in calling the relevant races for this market, it will resolve based on the official certification.
              - generic [ref=e277]: Early generic ballot polling showing a Democratic advantage of four to six points has positioned a full Democratic takeover of Congress as the leading trader consensus at 44.5 percent. Republicans’ narrow Senate map, with 23 of their seats up for election amid a 53-47 majority, sustains the 36.5 percent probability of retaining the upper chamber while losing the House. Both parties defend slim majorities ahead of the November 2026 contests, and historical midterm patterns favoring the opposition party keep the top scenarios closely bunched. Ongoing redistricting litigation in several states, upcoming primaries, and any shifts in presidential approval ratings could alter the balance before Election Day.
